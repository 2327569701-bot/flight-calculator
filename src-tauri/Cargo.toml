[package]
name = "flight-calculator"
version = "4.0.0"
description = "Flight Calculator - A simple flight calculation tool"
authors = ["残月"]
license = "MIT"
repository = "https://github.com/2327569701-bot/flight-calculator"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
chrono = "0.4"
dirs = "6"
open = "5"
