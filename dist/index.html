<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f6fa">
  <title>Flight Calculator · 飞行计算器</title>
  <link rel="stylesheet" href="css/workspace.css">
  <script src="js/calculator-data.js" defer></script>
  <script src="js/flight-diagrams.js" defer></script>
  <script src="js/flight-session.js" defer></script>
  <script src="js/session-page.js" defer></script>
  <script src="js/workspace.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到计算器</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#session" aria-label="Flight Calculator 首页">
        <span class="brand-copy"><strong>Flight Calculator<span class="brand-dot">.</span></strong></span>
      </a>
      <div class="workspace-label">飞行工作台 <span>WORKSPACE</span></div>
      <nav id="nav" class="nav" aria-label="飞行工具"></nav>
      <div class="sidebar-bottom">
        <div class="sim-badge"><span class="status-dot"></span> 模拟飞行工具<span>MSFS / X-Plane</span></div>
        <button class="sidebar-settings" data-action="settings"><span data-icon="settings"></span><span>偏好设置</span><span class="shortcut-icon" data-icon="chevron"></span></button>
      </div>
    </aside>
    <div class="app-content">
      <header class="topbar">
        <div class="breadcrumb"><span data-icon="grid"></span><span>飞行工具</span><span class="breadcrumb-divider">/</span><strong id="breadcrumbCurrent">下滑角</strong></div>
        <div class="topbar-actions">
          <button class="unit-pill" data-action="settings" aria-label="更改单位设置"><span data-icon="sliders"></span><span id="unitSummary">混合单位</span><span data-icon="chevron"></span></button>
          <span class="toolbar-divider"></span>
          <button class="icon-button" id="themeToggle" aria-label="切换深色模式" title="切换深色模式"><span data-icon="moon"></span></button>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <form id="settingsForm">
      <div class="dialog-header"><div><span class="eyebrow">PREFERENCES</span><h2 id="settingsTitle">偏好设置</h2></div><button type="button" class="icon-button" data-close="settingsDialog" aria-label="关闭设置"><span data-icon="close"></span></button></div>
      <div class="dialog-body"><h3>单位系统</h3><p class="muted">选择熟悉的单位，让计算更顺手。</p><div id="settingsPresets" class="preset-buttons"></div><div id="settingsUnits"></div></div>
      <div class="dialog-footer"><button type="button" class="button button-secondary" data-close="settingsDialog">取消</button><button class="button button-primary" type="submit">应用设置<span data-icon="check"></span></button></div>
    </form>
  </dialog>
  <dialog class="pdf-dialog" id="pdfDialog" aria-labelledby="pdfTitle">
    <div class="dialog-header"><h2 id="pdfTitle">飞行手册</h2><button class="icon-button" data-close="pdfDialog" aria-label="关闭手册"><span data-icon="close"></span></button></div>
    <iframe id="pdfFrame" title="本地 PDF 飞行手册"></iframe>
  </dialog>
  <input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
  <div id="printReport" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
